<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>External FPP Web Access</title>
<style>
  :root {
    --bg: #1c1e21;
    --panel: #26292e;
    --border: #3a3f46;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #f2a21c;
    --accent-hover: #ffb73a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px 28px 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .brand { text-align: center; margin-bottom: 24px; }
  .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 12px;
    border-radius: 12px;
    background: var(--accent) url("icon.png") center/cover no-repeat;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .brand p { color: var(--muted); font-size: 13px; margin: 0; }
  form { margin-top: 20px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: var(--text); }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    background: #1a1c1f;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 11px 12px;
    font-size: 15px;
    font-weight: 600;
    color: #1c1e21;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .foot {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .error { display: none; margin-top: 14px; padding: 8px 10px; border: 1px solid #7a2e2e; border-radius: 6px; background: #3a1d1d; color: #f2b8b5; font-size: 13px; }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="logo"></div>
      <h1>External FPP Web Access</h1>
      <p>This port is password-protected.<br>
      Sign in to continue to the FPP web UI.</p>
    </div>
    <div class="error" id="login_error">Incorrect username or password. Please try again.</div>
    <form method="post" action="/">
      <label for="httpd_username">Username</label>
      <input type="text" id="httpd_username" name="httpd_username" autocomplete="username" required autofocus>
      <label for="httpd_password">Password</label>
      <input type="password" id="httpd_password" name="httpd_password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
  <script>
    // mod_auth_form redirects back here after a failed login. There is no
    // standard error flag, so a page reload after a POST of the login form
    // is treated as a failed attempt.
    if (window.history.replaceState) {
      window.history.replaceState(null, '', '/login.html');
    }
  </script>
</body>
</html>
