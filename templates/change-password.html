<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password &mdash; External FPP</title>
<style>
  :root {
    --bg: #1c1e21;
    --panel: #26292e;
    --border: #3a3f46;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #f2a21c;
    --accent-hover: #ffb73a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px 28px 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .brand { text-align: center; margin-bottom: 24px; }
  .logo {
    width: 56px;
    height: 56px;
    line-height: 56px;
    margin: 0 auto 12px;
    border-radius: 12px;
    background: var(--accent);
    color: #1c1e21;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .brand p { color: var(--muted); font-size: 13px; margin: 0; }
  form { margin-top: 20px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: var(--text); }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    background: #1a1c1f;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 11px 12px;
    font-size: 15px;
    font-weight: 600;
    color: #1c1e21;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: default; }
  .foot {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .msg { display: none; margin-top: 14px; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .msg.show { display: block; }
  .msg.err { border: 1px solid #7a2e2e; background: #3a1d1d; color: #f2b8b5; }
  .msg.ok { border: 1px solid #2e7a4a; background: #1d3a27; color: #bdf2cd; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">
      <div class="logo">FPP</div>
      <h1>Change Password</h1>
      <p id="who"></p>
    </div>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
    <form id="pwform">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="6">
      <label for="password_confirm">Confirm new password</label>
      <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required minlength="6">
      <button type="submit" id="save">Change Password</button>
    </form>
    <p class="foot" id="require_note">Your administrator requires you to set a new password before you continue.</p>
  </div>
  <script>
    var API = '/api/plugin/fpp-ExternalFPP';

    function showMsg(el, text) {
      document.querySelectorAll('.msg').forEach(function (m) { m.classList.remove('show'); });
      if (text) { el.textContent = text; el.classList.add('show'); }
    }

    fetch(API + '/session-user').then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.username) {
        // Not logged in; Apache should have sent anonymous visitors to the login page.
        window.location.replace('/login.html');
        return;
      }
      document.getElementById('who').textContent = 'Signed in as ' + res.username;
      if (!res.must_change) {
        // Normal login lands here (it is the password-reset success location) but
        // this account does not need a forced change, so carry on to the FPP UI.
        window.location.replace('/');
        return;
      }
    });

    document.getElementById('pwform').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var p = document.getElementById('new_password').value;
      var c = document.getElementById('password_confirm').value;
      document.getElementById('save').disabled = true;
      showMsg(document.getElementById('ok'), '');
      fetch(API + '/change-my-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: p, password_confirm: c })
      }).then(function (r) { return r.json(); }).then(function (res) {
        document.getElementById('save').disabled = false;
        if (res.success) {
          document.getElementById('new_password').value = '';
          document.getElementById('password_confirm').value = '';
          showMsg(document.getElementById('ok'), 'Password updated.');
          document.getElementById('require_note').style.display = 'none';
          setInterval(function () { window.location.replace('/'); }, 1200);
        } else {
          showMsg(document.getElementById('err'), res.message || 'Could not change password.');
        }
      }).catch(function () {
        document.getElementById('save').disabled = false;
        showMsg(document.getElementById('err'), 'Network error. Please try again.');
      });
    });
  </script>
</body>
</html>
